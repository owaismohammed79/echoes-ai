[pytest]
# Tests live in tests/ and import the application as `app.*`. `pythonpath = .`
# makes the project root importable without installing the package or relying on
# the invocation directory.
pythonpath = .
testpaths = tests
filterwarnings =
    # Starlette's TestClient deprecation notice is informational and not
    # actionable from this project.
    ignore::DeprecationWarning
